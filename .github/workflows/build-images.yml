name: Build and publish CI images

on:
  pull_request_target:
    branches:
      - develop
      - main
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-images.yml
      - node22/**
      - python312/**
      - python314/**
      - java21/**
      - java25/**
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ci-images-${{ github.event_name == 'pull_request_target' &&
    format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ${{ matrix.display_name }}
    if: >-
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request_target' && github.ref != 'refs/heads/main')
    runs-on: [self-hosted, linux, x64, proart]
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: node22
            display_name: Node.js 22
            context: node22
            local_name: ci-node22
            base_digest: sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
          - profile: python312
            display_name: Python 3.12
            context: python312
            local_name: ci-python312
            base_digest: sha256:0f5b26b9518d002b6173fd61daad821fa340635ebfec5bba471013f9ca114579
          - profile: python314
            display_name: Python 3.14
            context: python314
            local_name: ci-python314
            base_digest: sha256:416f0db2a2b561945630cef9877a7ea0581b27449eb9fd9df42f03e1b74b5b63
          - profile: java21
            display_name: Java 21
            context: java21
            local_name: ci-java21
            base_digest: sha256:75ce56643243c3db632be2ef259625fb42ee3be1334389659f7a1a61acb78783
          - profile: java25
            display_name: Java 25
            context: java25
            local_name: ci-java25
            base_digest: sha256:534968c051301957beae735e7ba1db54d99ddecf08746d3b9d4f318cc132dbc3
    env:
      LOCAL_IMAGE: ${{ matrix.local_name }}:${{ github.run_id }}-${{ github.run_attempt }}
      IMAGE_VERSION: "1"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Derive deterministic source metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          image_created="$(git show --no-show-signature --format=%cI -s "$SOURCE_SHA")"
          test -n "$image_created"
          echo "image_created=$image_created" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          IMAGE_CREATED: ${{ steps.metadata.outputs.image_created }}
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg "IMAGE_SOURCE=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg "IMAGE_REVISION=${SOURCE_SHA}" \
            --build-arg "IMAGE_CREATED=${IMAGE_CREATED}" \
            --build-arg "IMAGE_VERSION=${IMAGE_VERSION}" \
            --tag "$LOCAL_IMAGE" \
            "${{ matrix.context }}"

      - name: Verify local image contract
        env:
          IMAGE_CREATED: ${{ steps.metadata.outputs.image_created }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-image-contract.sh \
            "${{ matrix.profile }}" \
            "$LOCAL_IMAGE" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            "$SOURCE_SHA" \
            "$IMAGE_CREATED" \
            "$IMAGE_VERSION" \
            "${{ matrix.base_digest }}"

      - name: Verify Maven Wrapper bootstrap
        if: startsWith(matrix.profile, 'java')
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-maven-wrapper.sh \
            "$LOCAL_IMAGE" \
            "${{ matrix.profile == 'java21' && '21' || '25' }}"

      - name: Clean up job-owned Docker state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker image rm "$LOCAL_IMAGE" >/dev/null 2>&1 || true

  quality:
    name: Quality
    if: always() && github.event_name == 'pull_request_target'
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Enforce trusted pull request validation
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Fork pull requests cannot execute on the ProArt self-hosted runner."
            exit 1
          fi
          if [[ "$BASE_REF" == "main" && "$HEAD_REF" != "develop" ]]; then
            echo "::error::Release pull requests to main must originate from develop."
            exit 1
          fi
          if [[ "$VALIDATE_RESULT" != "success" ]]; then
            echo "::error::Image contract validation result: $VALIDATE_RESULT"
            exit 1
          fi

  publish:
    name: Build, validate and publish ${{ matrix.display_name }}
    if: github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, proart]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: node22
            display_name: Node.js 22
            context: node22
            local_name: ci-node22
            published_image: ghcr.io/experto-hub/ci-node22
            base_digest: sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
          - profile: python312
            display_name: Python 3.12
            context: python312
            local_name: ci-python312
            published_image: ghcr.io/experto-hub/ci-python312
            base_digest: sha256:0f5b26b9518d002b6173fd61daad821fa340635ebfec5bba471013f9ca114579
          - profile: python314
            display_name: Python 3.14
            context: python314
            local_name: ci-python314
            published_image: ghcr.io/experto-hub/ci-python314
            base_digest: sha256:416f0db2a2b561945630cef9877a7ea0581b27449eb9fd9df42f03e1b74b5b63
          - profile: java21
            display_name: Java 21
            context: java21
            local_name: ci-java21
            published_image: ghcr.io/experto-hub/ci-java21
            base_digest: sha256:75ce56643243c3db632be2ef259625fb42ee3be1334389659f7a1a61acb78783
          - profile: java25
            display_name: Java 25
            context: java25
            local_name: ci-java25
            published_image: ghcr.io/experto-hub/ci-java25
            base_digest: sha256:534968c051301957beae735e7ba1db54d99ddecf08746d3b9d4f318cc132dbc3
    env:
      LOCAL_IMAGE: ${{ matrix.local_name }}:${{ github.run_id }}-${{ github.run_attempt }}
      PUBLISHED_IMAGE: ${{ matrix.published_image }}
      BASE_DIGEST: ${{ matrix.base_digest }}
      IMAGE_VERSION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Derive deterministic source metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          image_created="$(git show --no-show-signature --format=%cI -s "$GITHUB_SHA")"
          test -n "$image_created"
          echo "image_created=$image_created" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          IMAGE_CREATED: ${{ steps.metadata.outputs.image_created }}
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg "IMAGE_SOURCE=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg "IMAGE_REVISION=${GITHUB_SHA}" \
            --build-arg "IMAGE_CREATED=${IMAGE_CREATED}" \
            --build-arg "IMAGE_VERSION=${IMAGE_VERSION}" \
            --tag "$LOCAL_IMAGE" \
            "${{ matrix.context }}"

      - name: Verify local image contract
        env:
          IMAGE_CREATED: ${{ steps.metadata.outputs.image_created }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-image-contract.sh \
            "${{ matrix.profile }}" \
            "$LOCAL_IMAGE" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            "$GITHUB_SHA" \
            "$IMAGE_CREATED" \
            "$IMAGE_VERSION" \
            "$BASE_DIGEST"

      - name: Verify Maven Wrapper bootstrap
        if: startsWith(matrix.profile, 'java')
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-maven-wrapper.sh \
            "$LOCAL_IMAGE" \
            "${{ matrix.profile == 'java21' && '21' || '25' }}"

      - name: Publish and prove registry image
        id: release
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_CREATED: ${{ steps.metadata.outputs.image_created }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release-image.sh \
            "${{ matrix.profile }}" \
            "${{ matrix.display_name }}" \
            "$LOCAL_IMAGE" \
            "$PUBLISHED_IMAGE" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            "$GITHUB_SHA" \
            "$IMAGE_CREATED" \
            "$IMAGE_VERSION" \
            "$BASE_DIGEST"

      - name: Verify public package visibility
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PACKAGE_NAME: ${{ matrix.local_name }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { data: packageMetadata } = await github.request(
              "GET /orgs/{org}/packages/{package_type}/{package_name}",
              {
                org: context.repo.owner,
                package_type: "container",
                package_name: process.env.PACKAGE_NAME,
              },
            );

            if (packageMetadata.visibility !== "public") {
              throw new Error(
                `${context.repo.owner}/${process.env.PACKAGE_NAME} is ` +
                  `${packageMetadata.visibility}, expected public. ` +
                  "Set the package visibility to Public and rerun this workflow.",
              );
            }

      - name: Create release record
        id: record
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_CONTRACT_TAG: ${{ steps.release.outputs.contract_tag }}
          RELEASE_COMMIT_TAG: ${{ steps.release.outputs.commit_tag }}
          RELEASE_DIGEST: ${{ steps.release.outputs.digest }}
          RELEASE_RUNTIME_VERSION: ${{ steps.release.outputs.runtime_version }}
          RELEASE_BASE_DIGEST: ${{ steps.release.outputs.base_digest }}
          RELEASE_LOGICAL_SIZE: ${{ steps.release.outputs.logical_size_bytes }}
        shell: bash
        run: |
          set -euo pipefail
          record="${RUNNER_TEMP}/${{ matrix.profile }}.record"
          {
            printf 'profile=%q\n' "${{ matrix.profile }}"
            printf 'image=%q\n' "$RELEASE_IMAGE"
            printf 'contract_tag=%q\n' "$RELEASE_CONTRACT_TAG"
            printf 'commit_tag=%q\n' "$RELEASE_COMMIT_TAG"
            printf 'digest=%q\n' "$RELEASE_DIGEST"
            printf 'runtime_version=%q\n' "$RELEASE_RUNTIME_VERSION"
            printf 'base_digest=%q\n' "$RELEASE_BASE_DIGEST"
            printf 'logical_size_bytes=%q\n' "$RELEASE_LOGICAL_SIZE"
          } > "$record"
          test -s "$record"
          echo "path=$record" >> "$GITHUB_OUTPUT"

      - name: Upload release record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-image-release-record-${{ matrix.profile }}-${{ github.sha }}
          path: ${{ steps.record.outputs.path }}
          if-no-files-found: error
          retention-days: 1

      - name: Clean up job-owned Docker state
        if: always()
        env:
          COMMIT_REFERENCE_CREATED: ${{ steps.release.outputs.commit_reference_created }}
          CONTRACT_REFERENCE_CREATED: ${{ steps.release.outputs.contract_reference_created }}
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          PUBLISHED_DIGEST: ${{ steps.release.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker image rm "$LOCAL_IMAGE" >/dev/null 2>&1 || true
          if [[ "$COMMIT_REFERENCE_CREATED" == "true" ]]; then
            docker image rm "${PUBLISHED_IMAGE}:sha-${GITHUB_SHA}" >/dev/null 2>&1 || true
          fi
          if [[ "$CONTRACT_REFERENCE_CREATED" == "true" ]]; then
            docker image rm "${PUBLISHED_IMAGE}:${IMAGE_VERSION}" >/dev/null 2>&1 || true
          fi
          if [[ -n "$PUBLISHED_DIGEST" ]]; then
            docker image rm "${PUBLISHED_IMAGE}@${PUBLISHED_DIGEST}" >/dev/null 2>&1 || true
          fi
          case "$DOCKER_CONFIG" in
            "$RUNNER_TEMP"/*) rm -rf -- "$DOCKER_CONFIG" ;;
            *) echo "Refusing to remove Docker config outside RUNNER_TEMP" >&2; exit 1 ;;
          esac

  release-manifest:
    name: Publish release manifest artifact
    if: github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main'
    needs: [publish]
    runs-on: [self-hosted, linux, x64, proart]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-image-release-record-*-${{ github.sha }}
          path: ${{ runner.temp }}/ci-image-release-records
          merge-multiple: true

      - name: Generate release manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/ci-images-release-${GITHUB_SHA}.json"
          bash scripts/generate-release-manifest.sh \
            "$GITHUB_SHA" \
            "${RUNNER_TEMP}/ci-image-release-records" \
            "$manifest"
          echo "path=$manifest" >> "$GITHUB_OUTPUT"

      - name: Upload release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-images-release-${{ github.sha }}
          path: ${{ steps.manifest.outputs.path }}
          if-no-files-found: error
          retention-days: 90
