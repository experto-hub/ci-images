name: Build and publish CI images

on:
  pull_request:
    paths:
      - .github/workflows/build-images.yml
      - node22/**
      - python312/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-images.yml
      - node22/**
      - python312/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  node22:
    name: Build, validate and publish Node.js 22
    runs-on: [self-hosted, linux, x64, proart]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        env:
          LOCAL_IMAGE: ci-node22:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg "IMAGE_SOURCE=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg "IMAGE_REVISION=${GITHUB_SHA}" \
            --build-arg "IMAGE_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg "IMAGE_VERSION=1" \
            --tag "$LOCAL_IMAGE" \
            node22

      - name: Smoke test image
        env:
          LOCAL_IMAGE: ci-node22:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm "$LOCAL_IMAGE" sh -ceu '
            node --version
            npm --version
            git --version
            test "$(node -p "process.versions.node.split(\".\")[0]")" = "22"
            test "$(uname -m)" = "x86_64"
            ! command -v python3
            ! command -v java
            ! command -v docker
          '

      - name: Inspect validated image
        env:
          LOCAL_IMAGE: ci-node22:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "$LOCAL_IMAGE" \
            --format 'image={{.RepoTags}} architecture={{.Architecture}} logical_size_bytes={{.Size}}'

      - name: Publish validated image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ github.token }}
          LOCAL_IMAGE: ci-node22:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/ci-node22"
          sha_tag="sha-${GITHUB_SHA}"
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-config-node22"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$LOCAL_IMAGE" "${image}:${sha_tag}"
          docker push "${image}:${sha_tag}"
          docker tag "$LOCAL_IMAGE" "${image}:1"
          docker push "${image}:1"
          {
            echo "## Node.js 22 image"
            echo
            echo "- Immutable tag: \`${image}:${sha_tag}\`"
            echo "- Moving contract tag: \`${image}:1\`"
          } >> "$GITHUB_STEP_SUMMARY"
  python312:
    name: Build, validate and publish Python 3.12
    runs-on: [self-hosted, linux, x64, proart]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        env:
          LOCAL_IMAGE: ci-python312:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg "IMAGE_SOURCE=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg "IMAGE_REVISION=${GITHUB_SHA}" \
            --build-arg "IMAGE_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg "IMAGE_VERSION=1" \
            --tag "$LOCAL_IMAGE" \
            python312

      - name: Smoke test image
        env:
          LOCAL_IMAGE: ci-python312:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm "$LOCAL_IMAGE" sh -ceu '
            python3 --version
            pip --version
            git --version
            test "$(python3 -c "import sys; print(sys.version_info.major)")" = "3"
            test "$(python3 -c "import sys; print(sys.version_info.minor)")" = "12"
            python3 -m venv /tmp/smoke-venv
            /tmp/smoke-venv/bin/python --version
            test "$(uname -m)" = "x86_64"
            ! command -v node
            ! command -v java
            ! command -v docker
          '

      - name: Inspect validated image
        env:
          LOCAL_IMAGE: ci-python312:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "$LOCAL_IMAGE" \
            --format 'image={{.RepoTags}} architecture={{.Architecture}} logical_size_bytes={{.Size}}'

      - name: Publish validated image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ github.token }}
          LOCAL_IMAGE: ci-python312:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/ci-python312"
          sha_tag="sha-${GITHUB_SHA}"
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-config-python312"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$LOCAL_IMAGE" "${image}:${sha_tag}"
          docker push "${image}:${sha_tag}"
          docker tag "$LOCAL_IMAGE" "${image}:1"
          docker push "${image}:1"
          {
            echo "## Python 3.12 image"
            echo
            echo "- Immutable tag: \`${image}:${sha_tag}\`"
            echo "- Moving contract tag: \`${image}:1\`"
          } >> "$GITHUB_STEP_SUMMARY"
